const fmt = n => n.toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' грн';
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function split(car){const m=car.match(/^(.*?)\s+(\d{2}-\d{2})$/);return m?[m[1],m[2]]:[car,''];}
const cars=[...new Set(ITEMS.map(i=>i.car))].sort((a,b)=>a.localeCompare(b,'uk'));
const sel=document.getElementById('car');
cars.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.append(o)});
const sum=a=>a.reduce((s,i)=>s+i.qty*i.price,0);
document.getElementById('stats').innerHTML=
  `<div class="stat"><b>${ITEMS.length}</b><span>позицій</span></div>`+
  `<div class="stat"><b>${cars.length}</b><span>машин</span></div>`+
  `<div class="stat"><b>${ITEMS.reduce((s,i)=>s+i.qty,0)}</b><span>штук</span></div>`+
  `<div class="stat"><b>${fmt(sum(ITEMS))}</b><span>загальна сума</span></div>`;
function hl(text,q){const t=esc(text);if(!q)return t;const i=t.toLowerCase().indexOf(esc(q).toLowerCase());
  return i<0?t:t.slice(0,i)+'<mark>'+t.slice(i,i+esc(q).length)+'</mark>'+t.slice(i+esc(q).length);}
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase(), c=sel.value;
  const f=ITEMS.filter(i=>(!c||i.car===c)&&(!q||[i.name,i.article,i.manufacturer,i.country,i.uktzed,i.car].join(' ').toLowerCase().includes(q)));
  const groups=cars.filter(car=>f.some(i=>i.car===car));
  let n=0;
  document.getElementById('list').innerHTML = groups.length? groups.map(car=>{
    const rows=f.filter(i=>i.car===car), [m,p]=split(car);
    return `<section class="group"><div class="ghead"><h2>${esc(m)}${p?`<span class="plate">${p}</span>`:''}</h2>
      <span class="sub">${rows.length} поз. · <b>${fmt(sum(rows))}</b></span></div>
      <div class="tbl"><table><thead><tr><th>№</th><th>Найменування</th><th>Артикул</th><th>Виробник</th><th>УКТЗЕД</th><th class="num">К-сть</th><th class="num">Ціна</th><th class="num">Сума</th></tr></thead><tbody>
      ${rows.map(i=>`<tr><td class="c-n small">${++n}</td><td class="c-name">${hl(i.name,q)}</td>
        <td><button class="art" data-a="${esc(i.article)}" title="Скопіювати артикул">${hl(i.article,q)}</button></td>
        <td><span class="brand">${hl(i.manufacturer,q)}</span> <span class="small">${esc(i.country)}</span></td>
        <td class="c-uk small">${esc(i.uktzed)}</td><td class="c-q num">${i.qty} шт</td><td class="c-p num">${fmt(i.price)}</td>
        <td class="c-s num"><b>${fmt(i.qty*i.price)}</b>${i.qty>1?`<div class="small">${i.qty} × ${i.price}</div>`:''}</td></tr>`).join('')}
      </tbody></table></div></section>`}).join('') : '<p class="empty">Нічого не знайдено. Спробуйте інший запит або оберіть «Усі машини».</p>';
  document.getElementById('total').textContent=fmt(sum(f));
}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1600)}
document.getElementById('list').addEventListener('click',e=>{const b=e.target.closest('.art');if(!b)return;
  const a=b.dataset.a;navigator.clipboard?.writeText(a).then(()=>toast('Скопійовано: '+a),()=>{const r=document.createRange();r.selectNodeContents(b);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Виділено — натисніть Ctrl+C')}) ?? toast(a)});
document.getElementById('q').addEventListener('input',render);
